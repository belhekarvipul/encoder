<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double Encode / Decode Utility</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 30px;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h2,h3 {
        color: #333;
    }

    textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-family: Consolas, monospace;
        font-size: 14px;
    }

    .btn-group {
        margin: 15px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    button {
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-weight: bold;
    }

    .encode-btn {
        background: #0078d4;
    }

    .decode-btn {
        background: #107c10;
    }

    .copy-btn {
        background: #ff8c00;
    }

    .clear-btn {
        background: #666;
    }

    .status {
        margin-top: 10px;
        font-size: 14px;
        color: green;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    th,
    td {
        border: 1px solid #ddd;
        padding: 10px;
        vertical-align: top;
        text-align: left;
    }

    th {
        background: #0078d4;
        color: white;
    }

    td pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .copy-value {
        background: #28a745;
        padding: 6px 10px;
        font-size: 12px;
    }

    .json-container {
        margin-top: 25px;
    }
</style>
</head>
<body>

<div class="container">

    <h2>Double Encode / Decode Tool</h2>

    <label><strong>Input / Output</strong></label>
    <textarea id="textArea"
        placeholder="Paste plain text, JSON, or encoded content here..."></textarea>

    <div class="btn-group">
        <button class="encode-btn" onclick="doubleEncode()">Encode</button>
        <button class="decode-btn" onclick="doubleDecode()">Decode</button>
        <button class="copy-btn" onclick="copyText()">Copy Result</button>
        <button class="clear-btn" onclick="clearAll()">Clear</button>
    </div>

    <div id="status" class="status"></div>

    <div class="json-container">
        <h3>Decoded JSON View</h3>
        <div id="jsonOutput"></div>
    </div>

</div>

<script>

function showStatus(message, isError = false) {
    const status = document.getElementById("status");
    status.textContent = message;
    status.style.color = isError ? "red" : "green";
}

function unicodeToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
}

function base64ToUnicode(str) {
    return decodeURIComponent(escape(atob(str)));
}

function doubleEncode() {

    try {

        const textarea = document.getElementById("textArea");

        const firstPass = unicodeToBase64(textarea.value);
        const secondPass = btoa(firstPass);

        textarea.value = secondPass;

        document.getElementById("jsonOutput").innerHTML = "";

        showStatus("Content encoded successfully.");

    } catch (e) {
        showStatus("Encoding failed: " + e.message, true);
    }
}

function doubleDecode() {

    try {

        const textarea = document.getElementById("textArea");
        const encodedValue = textarea.value.trim();

        const firstDecode = atob(encodedValue);
        const secondDecode = base64ToUnicode(firstDecode);

        textarea.value = secondDecode;

        try {
            const jsonData = JSON.parse(secondDecode);
            renderJsonTable(jsonData);
        } catch {
            document.getElementById("jsonOutput").innerHTML =
                "<p>Decoded content is not valid JSON.</p>";
        }

        showStatus("Content decoded successfully.");

    } catch (e) {
        showStatus("Decoding failed: " + e.message, true);
    }
}

function copyText() {

    const value = document.getElementById("textArea").value;

    if (!value) {
        showStatus("Nothing to copy.", true);
        return;
    }

    navigator.clipboard.writeText(value)
        .then(() => {
            showStatus("Content copied successfully.");
        })
        .catch(err => {
            showStatus("Copy failed: " + err, true);
        });
}

function clearAll() {

    document.getElementById("textArea").value = "";
    document.getElementById("jsonOutput").innerHTML = "";
    showStatus("Cleared.");
}

function copyValue(value) {

    navigator.clipboard.writeText(value)
        .then(() => {
            showStatus("Value copied successfully.");
        })
        .catch(err => {
            showStatus("Copy failed: " + err, true);
        });
}

function renderJsonTable(data) {

    const output = document.getElementById("jsonOutput");

    if (typeof data !== "object" || data === null) {
        output.innerHTML = "<pre>" + escapeHtml(String(data)) + "</pre>";
        return;
    }

    let html = `
        <table>
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
    `;

    Object.entries(data).forEach(([key, value]) => {

        const valueText = typeof value === "object"
            ? JSON.stringify(value, null, 2)
            : String(value);

        html += `
            <tr>
                <td>${escapeHtml(key)}</td>
                <td>
                    <pre>${escapeHtml(valueText)}</pre>
                </td>
                <td>
                    <button
                        class="copy-value"
                        onclick='copyValue(${JSON.stringify(valueText)})'>
                        Copy Value
                    </button>
                </td>
            </tr>
        `;
    });

    html += `
            </tbody>
        </table>
    `;

    output.innerHTML = html;
}

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
