<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double Encode / Decode Utility</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        padding: 30px;
        margin: 0;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h2 {
        margin-top: 0;
        color: #333;
    }

    textarea {
        width: 100%;
        height: 140px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        resize: vertical;
        margin-bottom: 15px;
    }

    .btn-group {
        margin-bottom: 20px;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 10px;
        color: white;
        font-weight: bold;
    }

    .encode-btn {
        background: #0078d4;
    }

    .decode-btn {
        background: #107c10;
    }

    .copy-btn {
        background: #ff8c00;
    }

    pre {
        background: #f7f7f7;
        padding: 15px;
        border-radius: 6px;
        overflow: auto;
        border: 1px solid #ddd;
    }

    .json-container {
        margin-top: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
    }

    th {
        background: #0078d4;
        color: white;
    }

    .copy-value {
        background: #28a745;
        color: white;
        padding: 6px 10px;
        border-radius: 4px;
    }

    .status {
        color: green;
        font-size: 14px;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="container">

    <h2>Double Encode / Decode Tool</h2>

    <label><strong>Input Text</strong></label>
    <textarea id="inputText" placeholder="Enter text or JSON..."></textarea>

    <div class="btn-group">
        <button class="encode-btn" onclick="doubleEncode()">Double Encode</button>
        <button class="decode-btn" onclick="doubleDecode()">Double Decode</button>
    </div>

    <h3>Encoded Result</h3>
    <pre id="encodedOutput"></pre>

    <div class="json-container">
        <h3>Decoded JSON Result</h3>
        <div id="jsonOutput"></div>
    </div>

    <div class="status" id="status"></div>

</div>

<script>
function doubleEncode() {
    const input = document.getElementById("inputText").value;

    try {
        const encoded = btoa(unescape(encodeURIComponent(input)));
        const doubleEncoded = btoa(encoded);

        document.getElementById("encodedOutput").textContent = doubleEncoded;
        document.getElementById("status").textContent = "Double encoding completed.";
    } catch (e) {
        document.getElementById("status").textContent =
            "Encoding failed: " + e.message;
    }
}

function doubleDecode() {
    const input = document.getElementById("inputText").value.trim();

    try {
        const firstDecode = atob(input);
        const secondDecode = atob(firstDecode);

        const text = decodeURIComponent(escape(secondDecode));

        let jsonData;

        try {
            jsonData = JSON.parse(text);
            renderJsonTable(jsonData);
        } catch {
            document.getElementById("jsonOutput").innerHTML =
                "<pre>" + escapeHtml(text) + "</pre>";
        }

        document.getElementById("status").textContent =
            "Double decoding completed.";
    } catch (e) {
        document.getElementById("status").textContent =
            "Decoding failed: " + e.message;
    }
}

function renderJsonTable(data) {

    const container = document.getElementById("jsonOutput");

    if (typeof data !== "object" || data === null) {
        container.innerHTML = "<pre>" + escapeHtml(String(data)) + "</pre>";
        return;
    }

    let html = `
        <table>
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                    <th>Copy</th>
                </tr>
            </thead>
            <tbody>
    `;

    Object.entries(data).forEach(([key, value]) => {

        const valueText =
            typeof value === "object"
            ? JSON.stringify(value, null, 2)
            : String(value);

        html += `
            <tr>
                <td>${escapeHtml(key)}</td>
                <td><pre style="margin:0">${escapeHtml(valueText)}</pre></td>
                <td>
                    <button class="copy-value"
                        onclick="copyValue(${JSON.stringify(valueText)})">
                        Copy Value
                    </button>
                </td>
            </tr>
        `;
    });

    html += `
            </tbody>
        </table>
    `;

    container.innerHTML = html;
}

function copyValue(value) {
    navigator.clipboard.writeText(value)
        .then(() => {
            document.getElementById("status").textContent =
                "Value copied successfully.";
        });
}

function escapeHtml(str) {
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
